name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ساخت APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: khayyam-apk
          path: app/build/outputs/apk/debug/*.apk
